<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>QuantEdge Data</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#05080A;--surface:#0A0F12;--card:#0F1518;
  --border:#1A2428;--border2:#243038;
  --text:#D4E0E8;--dim:#5A7080;--muted:#3A5060;
  --green:#00C896;--blue:#0096FF;--yellow:#FFB020;
  --red:#FF4050;--cyan:#00D4E0;
  --green-dim:#001A12;--blue-dim:#00081A;
}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;
  min-height:100vh;padding:20px;}
.mono{font-family:'IBM Plex Mono',monospace;}

/* Header */
.header{display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.brand{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:3px;
  color:var(--dim);text-transform:uppercase;}
.title{font-size:22px;font-weight:600;margin-top:4px;color:var(--text);}
.subtitle{font-size:11px;color:var(--dim);margin-top:4px;}

/* Token section */
.token-section{background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:16px;margin-bottom:20px;}
.token-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;
  color:var(--dim);margin-bottom:8px;font-family:'IBM Plex Mono',monospace;}
.token-row{display:flex;gap:8px;}
input{background:var(--bg);border:1px solid var(--border2);color:var(--text);
  font-family:'IBM Plex Mono',monospace;font-size:11px;padding:9px 12px;
  border-radius:6px;outline:none;flex:1;transition:border .15s;}
input:focus{border-color:var(--blue);}
input::placeholder{color:var(--muted);}
.btn{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
  padding:9px 16px;border-radius:6px;border:none;cursor:pointer;
  letter-spacing:1px;text-transform:uppercase;transition:all .15s;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-success{background:var(--green);color:#000;}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--dim);}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;}

/* Dataset card */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:16px;position:relative;overflow:hidden;transition:border .2s;}
.card:hover{border-color:var(--border2);}
.card-accent{position:absolute;top:0;left:0;width:3px;height:100%;border-radius:10px 0 0 10px;}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.card-name{font-size:13px;font-weight:600;color:var(--text);}
.card-desc{font-size:10px;color:var(--dim);margin-top:3px;line-height:1.5;}
.card-badge{font-size:9px;font-family:'IBM Plex Mono',monospace;letter-spacing:1px;
  padding:3px 7px;border-radius:4px;font-weight:600;}
.badge-free{background:#001A12;color:var(--green);border:1px solid #003020;}
.badge-token{background:#00081A;color:var(--blue);border:1px solid #001530;}

/* Date inputs */
.date-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;}
.date-label{font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;
  margin-bottom:3px;font-family:'IBM Plex Mono',monospace;}
.endpoint-note{font-size:9px;color:var(--muted);font-family:'IBM Plex Mono',monospace;
  background:var(--bg);padding:6px 8px;border-radius:4px;margin:8px 0;word-break:break-all;}

/* Progress */
.progress-bar{height:3px;background:var(--border);border-radius:2px;margin:8px 0;overflow:hidden;}
.progress-fill{height:100%;border-radius:2px;background:var(--blue);transition:width .3s;}
.progress-text{font-size:9px;color:var(--dim);font-family:'IBM Plex Mono',monospace;}
.status-msg{font-size:10px;margin-top:6px;font-family:'IBM Plex Mono',monospace;min-height:14px;}
.status-ok{color:var(--green);}
.status-err{color:var(--red);}
.status-run{color:var(--yellow);}

/* Log panel */
.log-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:14px;margin-top:20px;}
.log-title{font-size:9px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;
  font-family:'IBM Plex Mono',monospace;margin-bottom:10px;}
.log-entries{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--dim);
  max-height:160px;overflow-y:auto;line-height:1.8;}
.log-entries .ok{color:var(--green);}
.log-entries .err{color:var(--red);}
.log-entries .info{color:var(--cyan);}

@media(max-width:480px){
  .token-row{flex-direction:column;}
  .grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="brand">QuantEdge</div>
    <div class="title">Data Downloader</div>
    <div class="subtitle">Fetch market data directly from NSE / Upstox — saves as CSV</div>
  </div>
</div>

<!-- Token -->
<div class="token-section">
  <div class="token-label">Upstox Access Token (required for intraday data)</div>
  <div class="token-row">
    <input id="tokenInput" type="password" placeholder="Paste Upstox token here (for Upstox datasets)" />
    <button class="btn btn-primary" onclick="saveToken()">SAVE</button>
    <button class="btn btn-outline" onclick="clearToken()">CLEAR</button>
  </div>
  <div id="tokenStatus" style="font-size:10px;color:var(--dim);margin-top:6px;font-family:'IBM Plex Mono',monospace;"></div>
</div>

<!-- Dataset grid -->
<div class="grid" id="datasetGrid"></div>

<!-- Activity log -->
<div class="log-panel">
  <div class="log-title">Activity Log</div>
  <div class="log-entries" id="logEntries">Waiting for downloads...</div>
</div>

<script>
'use strict';

let token = '';

function saveToken() {
  const t = document.getElementById('tokenInput').value.trim().replace(/[\r\n\t]/g, '');
  if (!t) { alert('Paste token first'); return; }
  token = t;
  document.getElementById('tokenStatus').textContent = '✅ Token saved (' + t.length + ' chars) — ready for Upstox datasets';
  document.getElementById('tokenInput').value = '';
}

function clearToken() {
  token = '';
  document.getElementById('tokenStatus').textContent = 'Token cleared';
}

function addLog(msg, type='info') {
  const el = document.getElementById('logEntries');
  const line = document.createElement('div');
  line.className = type;
  const time = new Date().toLocaleTimeString('en-IN');
  line.textContent = time + '  ' + msg;
  el.insertBefore(line, el.firstChild);
  if (el.children.length > 50) el.removeChild(el.lastChild);
}

// ── Download helpers ─────────────────────────────────────────────

function downloadCSV(filename, content) {
  const blob = new Blob([content], { type: 'text/csv' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

async function upstoxFetch(path) {
  // Direct Upstox call — used for non-historical endpoints (positions, option chain)
  if (!token) { alert('Save your Upstox token first'); return null; }
  const r = await fetch('/api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'proxy_get', token, path })
  });
  return r.json();
}

async function downloadViaServer(type, from, to) {
  // Routes through our proxy server — bypasses CORS for historical data
  if (!token) { alert('Save your Upstox token first'); return null; }
  const r = await fetch('/download', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type, from, to, token })
  });
  if (!r.ok) { const e = await r.json(); throw new Error(e.error); }
  const rows = (await r.text()).split('\n').map(l => l.split(','));
  return rows;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Dataset definitions ──────────────────────────────────────────

const DATASETS = [

  {
    id:      'nifty_5min',
    name:    'NIFTY 5-Min Candles',
    desc:    'Intraday 5-minute OHLCV candles for NIFTY 50. Used directly by the signal engine for EMA, ATR, VWAP calculations.',
    accent:  '#0096FF',
    badge:   'token',
    dateRange: true,
    defaultFrom: '2025-11-01',
    defaultTo:   '2026-05-20',
    endpoint: '/v2/historical-candle/NSE_INDEX%7CNifty%2050/5minute/{to}/{from}',
    async fetch(from, to, onProgress) {
      onProgress(0, 1, 'Fetching via server...');
      const rows = await downloadViaServer('nifty_5min', from, to);
      onProgress(1, 1, 'Done');
      return rows;
    }
  },

  {
    id:      'nifty_15min',
    name:    'NIFTY 15-Min Candles',
    desc:    'Intraday 15-minute candles for NIFTY 50. Useful for longer-term trend analysis and backtesting.',
    accent:  '#00C896',
    badge:   'token',
    dateRange: true,
    defaultFrom: '2025-11-01',
    defaultTo:   '2026-05-20',
    async fetch(from, to, onProgress) {
      onProgress(0, 1, 'Fetching via server...');
      const rows = await downloadViaServer('nifty_15min', from, to);
      onProgress(1, 1, 'Done');
      return rows;
    }
  },

  {
    id:      'nifty_daily',
    name:    'NIFTY Daily OHLC',
    desc:    'Daily candlestick data for NIFTY 50 index. Use for market regime classification and multi-year backtesting.',
    accent:  '#FFB020',
    badge:   'token',
    dateRange: true,
    defaultFrom: '2024-01-01',
    defaultTo:   '2026-05-20',
    async fetch(from, to, onProgress) {
      onProgress(0, 1, 'Fetching...');
      const d = await upstoxFetch('/v2/historical-candle/NSE_INDEX%7CNifty%2050/day/' + to + '/' + from);
      const candles = d?.data?.candles || [];
      const rows = [['date','open','high','low','close','volume']];
      for (const c of [...candles].reverse()) {
        rows.push([c[0].slice(0,10), c[1], c[2], c[3], c[4], c[5]]);
      }
      onProgress(1, 1, 'Done');
      return rows;
    }
  },

  {
    id:      'banknifty_5min',
    name:    'BankNifty 5-Min Candles',
    desc:    'Intraday 5-minute candles for NIFTY Bank index. For future BankNifty strategy development.',
    accent:  '#00D4E0',
    badge:   'token',
    dateRange: true,
    defaultFrom: '2025-11-01',
    defaultTo:   '2026-05-20',
    async fetch(from, to, onProgress) {
      onProgress(0, 1, 'Fetching via server...');
      const rows = await downloadViaServer('banknifty_5min', from, to);
      onProgress(1, 1, 'Done');
      return rows;
    }
  },

  {
    id:      'option_chain',
    name:    'NIFTY Option Chain',
    desc:    'Current option chain snapshot — all strikes CE/PE with last price, OI, IV. Saves current market snapshot.',
    accent:  '#FF4050',
    badge:   'token',
    dateRange: false,
    async fetch(from, to, onProgress) {
      onProgress(0, 1, 'Fetching option chain...');
      const d = await upstoxFetch('/v2/option/contract?instrument_key=NSE_INDEX%7CNifty%2050');
      const contracts = d?.data || [];
      const rows = [['expiry','strike','type','instrument_key','last_price','oi']];
      for (const c of contracts) {
        rows.push([c.expiry, c.strike_price, c.instrument_type, c.instrument_key, c.last_price || '', c.oi || '']);
      }
      onProgress(1, 1, 'Done');
      return rows;
    }
  },

  {
    id:      'positions',
    name:    'Current Positions',
    desc:    'Your live Upstox intraday positions with entry price, current LTP, P&L.',
    accent:  '#8050FF',
    badge:   'token',
    dateRange: false,
    async fetch(from, to, onProgress) {
      onProgress(0, 1, 'Fetching positions...');
      const d = await upstoxFetch('/v2/portfolio/short-term-positions');
      const pos = d?.data || [];
      const rows = [['symbol','quantity','avg_price','last_price','pnl','product']];
      for (const p of pos) {
        rows.push([p.trading_symbol, p.quantity, p.average_price, p.last_price, p.pnl, p.product]);
      }
      onProgress(1, 1, 'Done');
      return rows;
    }
  },

];

// ── Utility ──────────────────────────────────────────────────────

function getWeekdays(from, to) {
  const days = [];
  const cur  = new Date(from);
  const end  = new Date(to);
  while (cur <= end) {
    if (cur.getDay() > 0 && cur.getDay() < 6)
      days.push(cur.toISOString().slice(0,10));
    cur.setDate(cur.getDate() + 1);
  }
  return days;
}

function csvToString(rows) {
  return rows.map(r => r.map(v => {
    const s = String(v ?? '');
    return s.includes(',') ? '"' + s + '"' : s;
  }).join(',')).join('\n');
}

// ── Render cards ─────────────────────────────────────────────────

function renderCard(ds) {
  const div = document.createElement('div');
  div.className = 'card';
  div.id = 'card_' + ds.id;

  const badgeClass = ds.badge === 'token' ? 'badge-token' : 'badge-free';
  const badgeText  = ds.badge === 'token' ? 'UPSTOX TOKEN' : 'FREE';

  let dateHtml = '';
  if (ds.dateRange) {
    dateHtml = `
      <div class="date-row">
        <div>
          <div class="date-label">From</div>
          <input type="date" id="from_${ds.id}" value="${ds.defaultFrom}" style="width:100%"/>
        </div>
        <div>
          <div class="date-label">To</div>
          <input type="date" id="to_${ds.id}" value="${ds.defaultTo}" style="width:100%"/>
        </div>
      </div>`;
  }

  const endpointNote = ds.endpoint
    ? `<div class="endpoint-note">${ds.endpoint}</div>`
    : '';

  div.innerHTML = `
    <div class="card-accent" style="background:${ds.accent}"></div>
    <div class="card-header">
      <div>
        <div class="card-name">${ds.name}</div>
        <div class="card-desc">${ds.desc}</div>
      </div>
      <span class="card-badge ${badgeClass}">${badgeText}</span>
    </div>
    ${endpointNote}
    ${dateHtml}
    <div class="progress-bar"><div class="progress-fill" id="prog_${ds.id}" style="width:0%"></div></div>
    <div class="progress-text" id="progText_${ds.id}">Ready</div>
    <div class="status-msg" id="status_${ds.id}"></div>
    <div style="margin-top:10px">
      <button class="btn btn-success" id="btn_${ds.id}" onclick="startDownload('${ds.id}')" style="width:100%">
        ⬇ DOWNLOAD CSV
      </button>
    </div>`;

  return div;
}

async function startDownload(id) {
  const ds  = DATASETS.find(d => d.id === id);
  const btn = document.getElementById('btn_' + id);
  const prog = document.getElementById('prog_' + id);
  const progText = document.getElementById('progText_' + id);
  const status   = document.getElementById('status_' + id);

  if (ds.badge === 'token' && !token) {
    alert('Save your Upstox token first (top of page)');
    return;
  }

  const from = document.getElementById('from_' + id)?.value || ds.defaultFrom;
  const to   = document.getElementById('to_'   + id)?.value || ds.defaultTo;

  btn.disabled = true;
  status.className = 'status-msg status-run';
  status.textContent = 'Fetching...';
  addLog('Starting: ' + ds.name, 'info');

  const onProgress = (done, total, current) => {
    const pct = Math.round(done / total * 100);
    prog.style.width = pct + '%';
    progText.textContent = done + '/' + total + ' — ' + current;
  };

  try {
    const rows = await ds.fetch(from, to, onProgress);
    if (!rows || rows.length <= 1) throw new Error('No data returned');

    const filename = ds.id + '_' + from + '_to_' + to + '.csv';
    downloadCSV(filename, csvToString(rows));

    status.className = 'status-msg status-ok';
    status.textContent = '✅ Downloaded: ' + (rows.length - 1) + ' rows → ' + filename;
    prog.style.background = '#00C896';
    addLog('✅ ' + ds.name + ': ' + (rows.length-1) + ' rows', 'ok');
  } catch(e) {
    status.className = 'status-msg status-err';
    status.textContent = '❌ Error: ' + e.message;
    prog.style.background = '#FF4050';
    addLog('❌ ' + ds.name + ': ' + e.message, 'err');
  }

  btn.disabled = false;
}

// ── Init ─────────────────────────────────────────────────────────
const grid = document.getElementById('datasetGrid');
for (const ds of DATASETS) {
  grid.appendChild(renderCard(ds));
}
</script>
</body>
</html>
